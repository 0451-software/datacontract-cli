# CI for datacontract-cli. Most quality gates (ruff lint, ruff format, uv
# build) now run through the 0451-software org reusable workflow. Project-
# specific pytest and CLI smoke tests stay inline because the reusable is
# designed for projects that commit a uv.lock, and datacontract-cli does
# not — uv.lock is .gitignore'd (see pytest's "uv run --all-extras --dev"
# note below for the override command).
#
# Gates DISABLED with rationale:
#   - audit           requires uv export --locked
#   - freshness       requires uv.lock
#   - integration     no pytest markers are declared in this project; CLI smoke
#                     tests are run inline below instead
#   - typecheck       no mypy configured in pyproject.toml
# Re-enable each by setting the corresponding *_enabled: true once the
# underlying prerequisite exists.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

name: CI

# Auto-cancel stale runs on new pushes to the same ref so PRs don't pile up
# on an aging branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (reusable)
    uses: 0451-software/reusable-workflows/.github/workflows/python-quality-gates.yml@v1.x
    with:
      python_version: "3.11"

      # lint and format run from an ephemeral `uv tool run` environment, so
      # neither needs a uv.lock — they work on day one. We pin to the
      # project's declared ruff==0.15.7 (pyproject.toml dev extra) rather
      # than letting the reusable default to its own ruff==0.16.8 pin.
      lint_command: "uv tool run --from ruff==0.15.7 ruff check ."
      format_command: "uv tool run --from ruff==0.15.7 ruff format --check ."

      # pytest override drops the reusable's default `--locked` invocation
      # (no uv.lock is committed) and `pytest -n0` matches the original CI
      # (no xdist). Sqlserver tests are excluded because they need the
      # msodbcsql18 apt package, which the reusable does not install; see
      # the follow-up tracking comment for the system-dep gap.
      unit_tests_enabled: true
      unit_test_command: "uv run --all-extras --dev pytest -n0 --ignore=tests/test_test_sqlserver.py --ignore=tests/test_sqlserver_soda_connection.py --ignore=tests/test_import_sql_sqlserver.py"

      # `uv build` does not need a lockfile, so this stays on.
      build_enabled: true

      # Disabled gates (see file header for rationale).
      typecheck_enabled: false
      audit_enabled: false
      freshness_enabled: false
      integration_tests_enabled: false

  integration-tests:
    name: Integration tests (CLI smoke)
    # Kept verbatim from the previous CI workflow. This is a smoke test of
    # the installed `datacontract` binary against a fixture, NOT a pytest
    # marker suite. Run on py3.11 to match the project's supported window
    # (pyproject.toml says requires-python = ">=3.10,<3.13").
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{matrix.python-version}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.' # do not install dev dependencies or other extras
      - name: Test datacontract --help
        run: datacontract --help
      - name: Test datacontract --version
        run: datacontract --version
      - name: Test datacontract init
        run: datacontract init new-datacontract.yaml
      - name: Test datacontract export
        run: datacontract export --format sql tests/fixtures/export/datacontract.odcs.yaml
      - name: Install dependencies with duckdb
        run: |
          pip install -e '.[duckdb]'
      - name: Test datacontract test
        run: cd tests && datacontract test fixtures/local-delta/datacontract.yaml

  docker:
    runs-on: ubuntu-latest
    needs:
      - quality
      - integration-tests
    # Only build the Docker image on direct pushes to main on the canonical
    # upstream repo, matching the original behavior.
    if: github.event_name != 'pull_request' && github.repository == 'datacontract/datacontract-cli'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            datacontract/cli
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/arm64 is disabled
          # duckdb currently does not support linux_arm64_gcc4
          # https://duckdb.org/docs/extensions/working_with_extensions#platforms
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: datacontract/cli:snapshot-latest
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
